# Surcharges prod : secrets dans .env.local sur le serveur (non versionné).

services:

    huitparfait-auth:
        environment:
            COOKIE_IS_SECURE: "true"
            # Remplacer par ton domaine (pas huitparfait.fr)
            CORS_ORIGIN: https://pronos.example.com
            SERVER_URL: https://pronos.example.com

    huitparfait-api:
        environment:
            COOKIE_IS_SECURE: "true"
            NEO4J_URI: bolt://huitparfait-data:7687
            NEO4J_USERNAME: neo4j
            NEO4J_PASSWORD: neo4j
