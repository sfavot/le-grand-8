services:

    traefik:
        command: --web --docker --docker.domain=localhost --logLevel=DEBUG
        ports:
            - "3000:80"

    huitparfait-front:
        image: node:6.2.0
        entrypoint: npm run dev
        working_dir: /app
        volumes:
            - ./huitparfait-front:/app
        labels:
            - "traefik.port=8081"
            - "traefik.frontend.rule=Host:localhost"

    huitparfait-auth:
        image: node:6.2.0
        entrypoint: npm run dev
        working_dir: /app
        volumes:
            - ./huitparfait-auth:/app
        environment:
            NODE_ENV: development
        labels:
            - "traefik.frontend.rule=Host:localhost;PathPrefix:/api,/auth"

    huitparfait-api:
        image: node:6.2.0
        entrypoint: npm run dev
        working_dir: /app
        volumes:
            - ./huitparfait-api:/app
        environment:
            NODE_ENV: development
            NEO4J_URI: bolt://huitparfait-data:7687
            NEO4J_USERNAME: neo4j
            NEO4J_PASSWORD: huitparfait-local

    huitparfait-data:
        image: neo4j:5.26-community
        environment:
            # Neo4j 5 refuse le mot de passe par défaut "neo4j"
            NEO4J_AUTH: neo4j/huitparfait-local
        volumes:
            - './huitparfait-data/data:/data'
        ports:
            - '7474:7474'
            - '7687:7687'
