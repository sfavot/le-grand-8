name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API : lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huitparfait-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: huitparfait-api/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  auth:
    name: Auth : lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huitparfait-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: huitparfait-auth/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  data:
    name: Données WC 2026 : cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Vérifier le seed Cypher
        run: |
          node scripts/generate-wc2026-cql.mjs
          git diff --exit-code huitparfait-data/init-data-2026wc.cql
